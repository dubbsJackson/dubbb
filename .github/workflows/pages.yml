# Publishes the game to GitHub Pages so anyone can play it at a public link
# (no login). The site root IS the game — send people the Pages URL and it
# loads straight into DreamBodX Fitness.
name: deploy-game-to-pages
on:
  push:
    branches: [claude/claude-connector-completion-69tmx7]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Build single-file game
        run: npx vite build --config vite.pages.config.js
      - name: Configure Pages (enables it if needed)
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
