# Publishes the game to a `gh-pages` branch so it can be served on GitHub Pages
# at a public link (no login). The branch root IS the game — one self-contained
# HTML file — so the Pages URL loads straight into DreamBodX Fitness.
#
# ONE-TIME SETUP (repo admin, ~10 seconds): after this workflow first runs and
# creates the gh-pages branch, go to Settings → Pages → Build and deployment →
# Source: "Deploy from a branch" → Branch: gh-pages / (root) → Save.
# After that every push here republishes automatically.
name: deploy-game-to-pages
on:
  push:
    branches: [claude/claude-connector-completion-69tmx7]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Build single-file game
        run: npx vite build --config vite.pages.config.js
      - name: Publish to gh-pages branch
        run: |
          cd dist-pages
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy DreamBodX game to GitHub Pages"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
