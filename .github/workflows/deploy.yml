name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/dreambodyx-ebook-website-v8tn59, main]
  workflow_dispatch:

# Publishing to a gh-pages branch (below) needs write access to repo contents.
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      # Pushes the built dist/ to a gh-pages branch. This works from any source
      # branch (unlike the github-pages environment, which only allows the
      # default branch). After the first run, enable Pages once in
      # Settings -> Pages -> Source: "Deploy from a branch" -> gh-pages / (root).
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
