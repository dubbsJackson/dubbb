# Temporary: pull the second Higgsfield art batch into game/assets/raw2 (the sandbox
# can't reach the CDN, but Actions runners can). Removed once the assets are vendored.
name: fetch-art2
on:
  push:
    branches: [claude/claude-connector-completion-69tmx7]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and commit
        run: |
          set -euo pipefail
          if [ -d game/assets/raw2 ]; then echo "already fetched"; exit 0; fi
          mkdir -p game/assets/raw2
          b="https://d8j0ntlcm91z4.cloudfront.net/user_2vhLybIsQFgOBk9vfUszUKMb1zW"
          curl -fsSL -o game/assets/raw2/logo1.svg      "$b/hf_20260706_195439_19bd6231-d48c-49e5-9161-da923349f39b.svg"
          curl -fsSL -o game/assets/raw2/logo2.svg      "$b/hf_20260706_195440_7cb210a9-f7d4-46ac-8103-71d08974c8b7.svg"
          curl -fsSL -o game/assets/raw2/logo1.webp     "$b/hf_20260706_195439_19bd6231-d48c-49e5-9161-da923349f39b_min.webp"
          curl -fsSL -o game/assets/raw2/logo2.webp     "$b/hf_20260706_195440_7cb210a9-f7d4-46ac-8103-71d08974c8b7_min.webp"
          curl -fsSL -o game/assets/raw2/cover1.png     "$b/hf_20260706_195443_136444f1-2329-42c0-bd3f-630cff5f72ca.png"
          curl -fsSL -o game/assets/raw2/cover2.png     "$b/hf_20260706_195443_000f11a6-e7f6-4ca2-ae74-b41267135402.png"
          curl -fsSL -o game/assets/raw2/square1.png    "$b/hf_20260706_195445_83f7a2b3-38d3-4099-ad96-d1ebaaf00315.png"
          curl -fsSL -o game/assets/raw2/square2.png    "$b/hf_20260706_195445_eb953861-2cda-4dde-9a28-6c35cfc9bd73.png"
          curl -fsSL -o game/assets/raw2/hero.png       "$b/hf_20260706_195456_40c18b7e-bb77-4914-a3e9-b5f0fbbca94f.png"
          curl -fsSL -o game/assets/raw2/gym-easy.png   "$b/hf_20260706_195459_5c701137-67ec-40a9-bc84-2bbcf2967889.png"
          curl -fsSL -o game/assets/raw2/gym-medium.png "$b/hf_20260706_195501_ac876a8e-99d9-4cc8-8b03-7c85e966dd7b.png"
          curl -fsSL -o game/assets/raw2/gym-hard.png   "$b/hf_20260706_195504_bb7d74d2-6d04-441a-9c05-a5bead87bf77.png"
          ls -la game/assets/raw2
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game/assets/raw2
          git commit -m "Fetch Higgsfield art batch 2 (raw) [skip ci]"
          git push
