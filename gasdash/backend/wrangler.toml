name = "gasdash-payments"
main = "worker.js"
compatibility_date = "2026-01-01"

[vars]
# Where the app lives (customers are sent back here after paying)
APP_URL = "https://dubbsjackson.github.io/dubbb/gasdash/"
# Only this origin may call the API from a browser
ALLOWED_ORIGIN = "https://dubbsjackson.github.io"

# The Stripe secret key is NOT set here — it's a secret:
#   npx wrangler secret put STRIPE_SECRET_KEY
